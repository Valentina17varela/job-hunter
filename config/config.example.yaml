# Default configuration. Personal values (search criteria, salary, tone) are filled in
# when the feature that uses them is set up; see specs/04-filtering.md and specs/07-cli-config.md.
sources:
  aggregators: [remotive, remoteok, weworkremotely, arbeitnow, jobicy]
  wwr_categories:
    - remote-programming-jobs
    - remote-back-end-programming-jobs
    - remote-full-stack-programming-jobs
    - remote-devops-sysadmin-jobs
  arbeitnow_pages: 3
  companies_file: config/companies.yaml
  candidates_file: config/company_candidates.txt
  max_concurrency: 5
  max_per_host: 2
  stale_days: 7

search:
  titles_include: []
  titles_exclude: ["intern", "junior", "manager", "director"]
  keywords_include: []
  keywords_exclude: []
  seniority: []
  work_mode: ["remote"]
  locations_allowed: []
  salary:
    min_usd: 0
    on_missing: pass
  max_age_days: 30          # aggregators only (they publish fresh dates)
  max_age_days_ats: null    # company boards: a listed posting is open; set e.g. 120 to skip evergreen ones

llm:
  backend: claude_cli          # claude_cli = your Claude subscription (run `claude auth login` once)
                               # anthropic_api = API key in ANTHROPIC_API_KEY
  claude_path: claude
  timeout_seconds: 180
  max_attempts: 3
  effort: low                  # keeps scoring fast and terse (claude --effort)

scoring:
  model: haiku                 # alias for claude_cli; e.g. claude-haiku-5-5 for the API
  score_threshold: 75
  batch_size: 8                # postings per LLM call
  max_description_tokens: 1500
  max_profile_tokens: 3000
  # Tell the scorer where you live and how you can work, e.g.:
  # "Based in Colombia. Can work from Colombia, or for companies in English-speaking countries
  #  only as an independent contractor (no work visa)."
  candidate_context: ""
  use_batch: false

tailoring:
  model: sonnet                # alias for claude_cli; e.g. claude-sonnet-5-5 for the API
  mode: select
  max_packages_per_day: 10
  languages: ["en", "es"]
  tone: "formal but warm, concrete and confident"
  max_cv_pages: 1

latex:
  engine: tectonic
  timeout_seconds: 60

budget:
  max_llm_calls_per_run: 60    # claude_cli backend: cap on LLM calls per run
  daily_budget_usd: 1.00       # anthropic_api backend

fx_rates_to_usd:
  EUR: 1.08
  COP: 0.00025
  GBP: 1.27

paths:
  cv_master: config/cv/master.tex
  letter_template: config/cv/letter_template.tex
  db: data/jobhunter.db
  out: out/

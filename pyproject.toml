[project]
name = "jobhunter"
version = "0.1.0"
description = "Local pipeline that finds job postings, scores them and prepares application packages for human review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

# Files the installed tool needs (read through jobhunter.resources); the repo copies in config/
# stay the single source of truth.
[tool.hatch.build.targets.wheel.force-include]
"config/config.example.yaml" = "jobhunter/data/config.example.yaml"
"config/company_candidates.txt" = "jobhunter/data/company_candidates.txt"
"config/letter_template.example.tex" = "jobhunter/data/letter_template.example.tex"
"config/cv.example.tex" = "jobhunter/data/cv.example.tex"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/jobhunter/demo.py" = ["E501"]  # fictional postings are long strings

[tool.pytest.ini_options]
testpaths = ["tests"]

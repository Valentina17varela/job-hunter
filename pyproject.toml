[project]
name = "jobhunter"
version = "0.1.0"
description = "Local pipeline that finds job postings, scores them and prepares application packages for human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "anthropic>=0.40",
    "pypdf>=4.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Bug report
description: Something does not work as the README or the specs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you run?
      description: The command or the buttons you pressed, in order.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: "`jobhunter --version`, your OS, how you installed it (uv tool, clone, Docker)"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output or log
      description: Paste the error. **Remove names, emails, keys and CV text first.**
      render: text

name: Feature request
description: An idea. Start from the problem, not the solution
labels: [needs-spec]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: markdown
    attributes:
      value: |
        Check `specs/08-roadmap.md` first: it may already be planned. Features that apply on your behalf, need a login, add telemetry or run in the background do not fit the project (see CONTRIBUTING.md).
